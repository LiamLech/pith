[package]
name = "pith"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Morphs an instrument's timbre toward a pure sine wave by cutting low-amplitude FFT bins."

[lib]
crate-type = ["cdylib"]

[dependencies]
